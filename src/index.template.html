<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>在我們之間 · Between Us</title>
<meta name="description" content="雙人對話沙龍：700 個問題、7 個主題，抽卡、翻面、好好說話。">
<meta property="og:title" content="在我們之間 · Between Us">
<meta property="og:description" content="雙人對話沙龍：700 個問題、7 個主題，抽卡、翻面、好好說話。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23F9F7F2'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%23C87D65'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --clay: #C87D65;
    --clay-hover: #A65E47;
    --paper: #F9F7F2;
    --card: #FFFFFF;
    --card-back: #F5EFE6;
    --ink: #2D282A;
    --muted: #78726D;
    --gold: rgba(212,175,55,0.35);
    --line: rgba(45,40,42,0.1);
    --shadow: 0 16px 40px -12px rgba(45,40,42,0.08);
  }
  .dark {
    --clay: #D98E76;
    --clay-hover: #E4A38E;
    --paper: #161514;
    --card: #201E1C;
    --card-back: #262320;
    --ink: #F2EFE9;
    --muted: #9E978F;
    --gold: rgba(212,175,55,0.45);
    --line: rgba(242,239,233,0.1);
    --shadow: 0 16px 40px -12px rgba(0,0,0,0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) {
      --clay: #D98E76;
      --clay-hover: #E4A38E;
      --paper: #161514;
      --card: #201E1C;
      --card-back: #262320;
      --ink: #F2EFE9;
      --muted: #9E978F;
      --gold: rgba(212,175,55,0.45);
      --line: rgba(242,239,233,0.1);
      --shadow: 0 16px 40px -12px rgba(0,0,0,0.45);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans TC', system-ui, sans-serif;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .serif {
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  }
  .btn-clay {
    background: var(--clay);
    color: #FFFFFF;
    border-radius: 999px;
    transition: all 0.2s ease;
  }
  .btn-clay:hover {
    background: var(--clay-hover);
    transform: translateY(-1px);
  }
  .btn-clay:active {
    transform: translateY(0);
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    border-radius: 999px;
    padding: 0.4rem 1.1rem;
    font-size: 0.875rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    user-select: none;
  }
  .chip:hover {
    border-color: var(--clay);
    color: var(--ink);
  }
  .chip.active {
    background: var(--clay);
    color: #FFFFFF;
    border-color: var(--clay);
    box-shadow: 0 4px 12px rgba(200,125,101,0.25);
  }

  /* 3D Card Stage */
  .stage {
    perspective: 1200px;
  }
  .card-3d {
    width: 100%;
    min-height: 380px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease;
    border-radius: 28px;
    box-shadow: var(--shadow);
  }
  .card-3d.flipped {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 28px;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }
  .card-face.front {
    background: var(--card);
    z-index: 2;
  }
  .card-face.back {
    background: var(--card-back);
    transform: rotateY(180deg);
    z-index: 1;
  }
  .card-inner-border {
    position: absolute;
    inset: 10px;
    border: 1px solid var(--gold);
    border-radius: 20px;
    pointer-events: none;
    opacity: 0.7;
  }

  .drawer-overlay {
    backdrop-filter: blur(4px);
    background: rgba(0, 0, 0, 0.35);
  }
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 999px;
  }
  .toast {
    transform: translate(-50%, 20px);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }
</style>
</head>
<body class="antialiased selection:bg-[#C87D65] selection:text-white flex flex-col justify-between">

  <!-- ================= Header ================= -->
  <header class="mx-auto w-full max-w-3xl px-5 pt-8 pb-4 text-center">
    <div class="flex items-center justify-end gap-2.5 mb-4 text-xs">
      <!-- Dark/Light Theme Toggle -->
      <button id="btn-theme" class="p-2 rounded-full border border-[var(--line)] text-[var(--muted)] hover:text-[var(--ink)] hover:border-[var(--clay)] transition" aria-label="切換主題模式">
        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      </button>

      <!-- Audio Mute Toggle -->
      <button id="btn-sound" class="p-2 rounded-full border border-[var(--line)] text-[var(--muted)] hover:text-[var(--ink)] hover:border-[var(--clay)] transition" aria-label="切換音效">
        <i data-lucide="volume-2" id="icon-volume" class="w-4 h-4"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative inline-flex items-center">
        <select id="lang-select" class="serif appearance-none bg-[var(--card)] border border-[var(--line)] rounded-full pl-3 pr-7 py-1 text-xs text-[var(--ink)] outline-none focus:border-[var(--clay)] transition cursor-pointer">
          <option value="zh-TW">繁體中文</option>
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
        </select>
        <i data-lucide="chevron-down" class="w-3 h-3 text-[var(--muted)] absolute right-2.5 pointer-events-none"></i>
      </div>
    </div>

    <h1 class="serif text-3xl sm:text-5xl md:text-6xl tracking-tight text-[var(--ink)]" id="ui-title">在我們之間 · Between Us</h1>
    <p class="serif text-sm sm:text-base md:text-lg text-[var(--muted)] mt-2 max-w-xl mx-auto" id="ui-subtitle">雙人對話沙龍：700 個問題、7 個主題，抽卡、翻面、好好說話。</p>
  </header>

  <!-- ================= Main Content ================= -->
  <main class="mx-auto w-full max-w-xl px-5 flex-1 flex flex-col justify-center">

    <!-- Category Chips Bar -->
    <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar custom-scrollbar justify-start sm:justify-center" id="chip-bar">
      <button class="chip active" data-cat="all">全部</button>
    </div>

    <!-- 3D Card -->
    <div class="stage w-full mb-6">
      <div class="card-3d cursor-pointer" id="card" role="button" tabindex="0" aria-label="翻轉卡片">
        
        <!-- Card Front -->
        <div class="card-face front relative overflow-hidden" id="card-front">
          <div class="card-inner-border"></div>
          
          <div class="relative z-10 flex items-center justify-between">
            <span class="serif text-xs tracking-wider uppercase px-3 py-1 rounded-full border border-[var(--clay)]/40 text-[var(--clay)] bg-[var(--clay)]/5 font-medium" id="card-tag">
              價值與未來
            </span>
            <div class="flex items-center gap-2">
              <button id="btn-timer-trigger" class="p-1.5 rounded-full text-[var(--muted)] hover:text-[var(--clay)] transition" aria-label="開啟計時器" title="5 分鐘計時器">
                <i data-lucide="timer" class="w-4 h-4"></i>
              </button>
              <button id="btn-bookmark" class="p-1.5 rounded-full text-[var(--muted)] hover:text-[var(--clay)] transition" aria-label="收藏題目" aria-pressed="false" title="收藏">
                <i data-lucide="bookmark" id="icon-bookmark" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="relative z-10 my-auto text-center py-6 px-2">
            <div class="serif text-xs tracking-widest text-[var(--clay)]/80 mb-3" id="card-no">NO. 001</div>
            <h2 class="serif text-xl sm:text-2xl md:text-3xl leading-relaxed text-[var(--ink)] font-normal select-none" id="card-q">
              問題會在這裡顯示
            </h2>
          </div>

          <div class="relative z-10 flex items-center justify-between text-xs text-[var(--muted)]">
            <span class="inline-flex items-center gap-1 hover:text-[var(--clay)] transition" id="card-flip-prompt">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
              <span id="ui-flip-hint">點擊翻面看提示</span>
            </span>
            <span class="serif tracking-wider" id="card-progress">01 / 100</span>
          </div>
        </div>

        <!-- Card Back -->
        <div class="card-face back relative overflow-hidden text-center" id="card-back">
          <div class="card-inner-border"></div>

          <div class="relative z-10 flex justify-between items-center w-full">
            <span class="serif text-xs tracking-widest text-[var(--muted)] uppercase">Between Us</span>
            <button id="btn-flipback" class="p-1.5 rounded-full text-[var(--muted)] hover:text-[var(--clay)] transition" aria-label="翻回題目">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="relative z-10 my-auto py-6 px-4">
            <div class="mx-auto w-12 h-12 rounded-full bg-[var(--clay)]/10 flex items-center justify-center text-[var(--clay)] mb-4">
              <i data-lucide="sparkles" class="w-6 h-6"></i>
            </div>
            <h3 class="serif text-2xl text-[var(--ink)] mb-3" id="ui-back-title">在我們之間</h3>
            <div class="w-8 h-px bg-[var(--clay)]/40 mx-auto mb-3"></div>
            <p class="serif text-sm sm:text-base text-[var(--muted)] leading-relaxed max-w-sm mx-auto" id="ui-back-quote">
              慢慢說，慢慢聽。沒有標準答案。
            </p>
          </div>

          <div class="relative z-10 text-xs text-[var(--muted)]">
            <span class="inline-flex items-center gap-1 hover:text-[var(--clay)] transition">
              <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
              <span id="ui-back-hint">點擊翻回題目</span>
            </span>
          </div>
        </div>

      </div>
    </div>

    <!-- Actions Control Bar -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <button id="btn-next" class="btn-clay flex-1 sm:flex-none sm:min-w-[160px] py-3 px-6 text-sm font-medium flex items-center justify-center gap-2 shadow-sm">
        <i data-lucide="shuffle" class="w-4 h-4"></i>
        <span id="ui-next">換一題</span>
      </button>
      <button id="btn-open-drawer" class="border border-[var(--line)] bg-[var(--card)] hover:border-[var(--clay)] text-[var(--ink)] rounded-full py-3 px-6 text-sm font-medium flex items-center justify-center gap-2 transition">
        <i data-lucide="list" class="w-4 h-4 text-[var(--muted)]"></i>
        <span id="ui-drawer-btn">從題庫挑</span>
      </button>
    </div>

    <!-- Keyboard Shortcuts Hint -->
    <div class="text-center text-[11px] text-[var(--muted)] pb-6 serif tracking-wider" id="ui-keyboard-hint">
      空白鍵：翻牌 ｜ →：換一題 ｜ F：收藏 ｜ T：計時器
    </div>

  </main>

  <!-- ================= Footer ================= -->
  <footer class="w-full text-center py-4 border-t border-[var(--line)] text-xs text-[var(--muted)] serif">
    <p>Between Us · 在我們之間 · 雙人對話沙龍</p>
  </footer>

  <!-- ================= Drawer Sidebar ================= -->
  <div class="fixed inset-0 z-40 drawer-overlay transition-opacity duration-300 opacity-0 pointer-events-none" id="drawer-overlay"></div>
  <aside class="fixed right-0 top-0 bottom-0 w-full sm:w-[420px] z-50 bg-[var(--card)] shadow-2xl border-l border-[var(--line)] transform translate-x-full transition-transform duration-300 ease-out flex flex-col" id="drawer" aria-hidden="true">
    
    <!-- Drawer Header -->
    <div class="p-5 border-b border-[var(--line)] flex items-center justify-between">
      <div>
        <h3 class="serif text-xl text-[var(--ink)]" id="ui-drawer-title">題庫抽屜</h3>
        <p class="text-xs text-[var(--muted)] mt-0.5" id="drawer-count-info"></p>
      </div>
      <button id="btn-close-drawer" class="p-1.5 rounded-full text-[var(--muted)] hover:text-[var(--ink)] transition" aria-label="關閉題庫">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Drawer Scope & Search -->
    <div class="p-4 border-b border-[var(--line)] space-y-3">
      <div class="flex gap-2">
        <button id="btn-drawer-all" class="flex-1 py-1.5 text-xs rounded-full bg-[var(--clay)] text-white font-medium transition" id="ui-drawer-all">全部</button>
        <button id="btn-drawer-fav" class="flex-1 py-1.5 text-xs rounded-full border border-[var(--line)] text-[var(--muted)] hover:text-[var(--ink)] transition" id="ui-drawer-fav">僅看收藏</button>
      </div>
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-[var(--muted)] absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="search" id="drawer-search" placeholder="搜尋問題…" class="w-full bg-[var(--paper)] border border-[var(--line)] rounded-xl pl-9 pr-4 py-2 text-xs text-[var(--ink)] outline-none focus:border-[var(--clay)] transition">
      </div>
    </div>

    <!-- Drawer List -->
    <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar" id="drawer-list">
      <!-- Injected by JavaScript -->
    </div>
  </aside>

  <!-- ================= 5-Minute Timer Modal ================= -->
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-opacity duration-200 opacity-0 pointer-events-none" id="timer-modal" aria-hidden="true">
    <div class="bg-[var(--card)] p-8 rounded-3xl shadow-2xl border border-[var(--line)] max-w-sm w-full text-center relative transform scale-95 transition-transform duration-200" id="timer-dialog">
      <button id="btn-close-timer" class="absolute right-4 top-4 p-1.5 text-[var(--muted)] hover:text-[var(--ink)] rounded-full transition" aria-label="關閉計時器">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="w-12 h-12 rounded-full bg-[var(--clay)]/10 text-[var(--clay)] flex items-center justify-center mx-auto mb-3">
        <i data-lucide="clock" class="w-6 h-6"></i>
      </div>
      
      <h3 class="serif text-2xl text-[var(--ink)] mb-1" id="ui-timer-title">5 分鐘計時器</h3>
      <p class="text-xs text-[var(--muted)] mb-6" id="ui-timer-prompt">給彼此五分鐘，一個人說，另一個人只聽。</p>

      <div class="text-6xl serif font-semibold tracking-wider text-[var(--clay)] mb-8" id="timer-display">05:00</div>

      <div class="flex items-center justify-center gap-3">
        <button id="btn-timer-start" class="btn-clay px-6 py-2.5 text-xs font-medium flex items-center gap-1.5">
          <i data-lucide="play" id="icon-timer-play" class="w-3.5 h-3.5"></i>
          <span id="ui-timer-start">開始</span>
        </button>
        <button id="btn-timer-reset" class="border border-[var(--line)] hover:border-[var(--clay)] text-[var(--ink)] px-5 py-2.5 text-xs rounded-full transition font-medium">
          <span id="ui-timer-reset">重設</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast fixed bottom-8 left-1/2 z-50 bg-[var(--ink)] text-[var(--paper)] text-xs px-4 py-2 rounded-full shadow-lg pointer-events-none serif tracking-wider">
    已更新
  </div>

<script>
window.__ALL_LANGS__ = __ALL_LANGS_PAYLOAD__;
</script>
<script>
__APP_JS_PAYLOAD__
</script>
</body>
</html>
