<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理員登入 · 在我們之間 Between Us</title>
  <link rel="icon" href="/icon.png">
  <style>
    :root {
      --bg: #F8F5F0;
      --card-bg: #FFFFFF;
      --border: #E8E2D9;
      --text-main: #2C2825;
      --text-muted: #8E877F;
      --accent: #C25B4E;
      --accent-soft: #F4EBE1;
      --accent-hover: #A8473B;
      --shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141312;
        --card-bg: #1F1D1A;
        --border: #35302A;
        --text-main: #F4EFEA;
        --text-muted: #9E958C;
        --accent: #E07A6D;
        --accent-soft: #382C28;
        --accent-hover: #F29387;
        --shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      }
    }
    body.dark {
      --bg: #141312;
      --card-bg: #1F1D1A;
      --border: #35302A;
      --text-main: #F4EFEA;
      --text-muted: #9E958C;
      --accent: #E07A6D;
      --accent-soft: #382C28;
      --accent-hover: #F29387;
      --shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }
    body.light {
      --bg: #F8F5F0;
      --card-bg: #FFFFFF;
      --border: #E8E2D9;
      --text-main: #2C2825;
      --text-muted: #8E877F;
      --accent: #C25B4E;
      --accent-soft: #F4EBE1;
      --accent-hover: #A8473B;
      --shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background-color 0.2s, color 0.2s;
    }
    .theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.2s;
    }
    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #E07A6D 0%, #C25B4E 100%);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(194, 91, 78, 0.25);
    }
    .logo-badge svg {
      width: 32px;
      height: 32px;
      fill: #FFFFFF;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      padding: 13px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(194, 91, 78, 0.25);
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .alert-error {
      background: #FEE8E6;
      color: #C25B4E;
      border: 1px solid #F5C6C2;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
      text-align: left;
    }
    body.dark .alert-error {
      background: #3B201D;
      color: #F59A8E;
      border-color: #61302A;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">深色模式</button>

  <div class="login-container">
    <div class="login-card">
      <!-- High-res Brand Icon -->
      <div class="logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>

      <h1 class="title">管理員登入</h1>
      <p class="subtitle">在我們之間 · 流量數據與使用者行為分析中心</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">管理者帳號</label>
          <input type="text" id="username" class="form-input" placeholder="請輸入 admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">管理者密碼</label>
          <input type="password" id="password" class="form-input" placeholder="請輸入密碼" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">登入數據後台</button>
        <div id="login-error" class="alert-error"></div>
      </form>
    </div>

    <div class="footer">
      &copy; 2026 在我們之間 Between Us · 內部安全管理系統
    </div>
  </div>

  <script>
    // If already logged in, redirect straight to /admin
    if (sessionStorage.getItem('between_us_admin_session')) {
      window.location.replace('/admin');
    }

    // Theme support
    const savedTheme = localStorage.getItem('admin_theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('theme-btn').textContent = '淺色模式';
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('admin_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = isDark ? '淺色模式' : '深色模式';
    }

    // Handle Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('btn-submit');

      errEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '驗證憑證中…';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          sessionStorage.setItem('between_us_admin_session', data.token);
          // Redirect directly to admin dashboard
          window.location.replace('/admin');
        } else {
          errEl.textContent = data.error || '帳號或密碼錯誤，請重新確認。';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = '連線失敗：' + err.message;
        errEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '登入數據後台';
      }
    });
  </script>
</body>
</html>
