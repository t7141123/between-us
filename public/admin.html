<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訪客與使用數據分析後台 · 在我們之間</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- 未登入自動重定向至專屬登入頁 -->
  <script>
    if (!sessionStorage.getItem('between_us_admin_session')) {
      window.location.replace('/login');
    }
  </script>
  <style>
    :root {
      --bg: #F8F5F0;
      --card-bg: #FFFFFF;
      --border: #E8E2D9;
      --text-main: #2C2825;
      --text-muted: #8E877F;
      --accent: #C25B4E;
      --accent-soft: #F4EBE1;
      --accent-hover: #A8473B;
      --success: #2E7D32;
      --success-soft: #E8F5E9;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    body.dark {
      --bg: #141312;
      --card-bg: #1F1D1A;
      --border: #35302A;
      --text-main: #F4EFEA;
      --text-muted: #9E958C;
      --accent: #E07A6D;
      --accent-soft: #382C28;
      --accent-hover: #F29387;
      --success: #4CAF50;
      --success-soft: #1B3820;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      transition: background-color 0.2s, color 0.2s;
    }

    /* 頂部導覽列 */
    .navbar {
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      background: var(--card-bg);
      border: 1px solid var(--border);
    }
    .brand-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .nav-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .nav-badge {
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-pill {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-logout {
      color: #E53935;
      border-color: #FFCDD2;
    }
    .btn-logout:hover {
      background: #FFEBEE;
      border-color: #E53935;
      color: #D32F2F;
    }

    /* 主內容容器 */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* 核心指標卡 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 480px) {
      .kpi-grid {
        grid-template-columns: 1fr;
      }
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justifyContent: space-between;
    }
    .kpi-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text-main);
    }
    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* 圖表網格 */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }
    .chart-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
    }

    /* 圖表容器高度 */
    .chart-canvas-wrapper {
      position: relative;
      width: 100%;
      height: 260px;
      max-height: 260px;
      flex-shrink: 0;
    }

    /* 排行清單 */
    .data-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }
    .data-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--bg);
      font-size: 13px;
    }
    .data-item-label {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .data-item-badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 數據表格 */
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th {
      color: var(--text-muted);
      font-weight: 600;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .user-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      font-weight: 600;
      padding: 3px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
    }
    .device-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }
    .duration-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      background: var(--success-soft);
      color: var(--success);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .status-badge.active {
      color: var(--success);
      font-weight: 600;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: #9E9E9E;
    }
    .status-badge.active .status-dot {
      background: #4CAF50;
      box-shadow: 0 0 8px #4CAF50;
    }
  </style>
</head>
<body>
  <!-- 頂部導覽列 -->
  <header class="navbar">
    <div class="nav-left">
      <div class="brand-icon-box">
        <img src="/icon.png" class="brand-icon-img" alt="在我們之間" onerror="this.src='/favicon.ico'">
      </div>
      <span class="nav-title">在我們之間 · 訪客與使用數據分析</span>
      <span class="nav-badge">即時監控中</span>
    </div>
    <div class="nav-actions">
      <span class="user-pill">管理者：系統管理員</span>
      <button class="btn-action" onclick="toggleTheme()" id="theme-btn">深色模式</button>
      <button class="btn-action" onclick="loadStats()" id="refresh-btn">重新整理</button>
      <button class="btn-action btn-logout" onclick="logout()">安全登出</button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="main-container">
    <!-- 核心數據統計 -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">今日造訪人數</div>
        <div class="kpi-value" id="kpi-today-visitors">0</div>
        <div class="kpi-sub">今日活躍獨立訪客</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">累積獨立訪客</div>
        <div class="kpi-value" id="kpi-total-visitors">0</div>
        <div class="kpi-sub">歷史累積不同使用者</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">累積造訪次數</div>
        <div class="kpi-value" id="kpi-total-sessions">0</div>
        <div class="kpi-sub">總開啟與使用階段數</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">平均使用時間</div>
        <div class="kpi-value" id="kpi-avg-duration">0 秒</div>
        <div class="kpi-sub">每位訪客平均停留時長</div>
      </div>
    </section>

    <!-- 圖表區 -->
    <div class="charts-grid">
      <!-- 趨勢圖 -->
      <div class="chart-panel">
        <div class="panel-header">
          <h3 class="panel-title">近 14 日造訪人數與使用時長趨勢圖</h3>
        </div>
        <div class="chart-canvas-wrapper">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- 設備比例 -->
      <div class="chart-panel">
        <div class="panel-header">
          <h3 class="panel-title">使用設備與作業系統佔比</h3>
        </div>
        <div class="chart-canvas-wrapper">
          <canvas id="platformChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 地理分佈 -->
    <div class="charts-grid" style="grid-template-columns: 1fr;">
      <div class="chart-panel">
        <div class="panel-header">
          <h3 class="panel-title">使用者地理分佈前 10 大地區</h3>
        </div>
        <ul class="data-list" id="country-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
          <li class="data-item"><span class="data-item-label">資料載入中…</span></li>
        </ul>
      </div>
    </div>

    <!-- 個別訪客使用記錄表格 -->
    <section class="chart-panel" style="margin-top: 24px;">
      <div class="panel-header">
        <div>
          <h3 class="panel-title">個別訪客使用記錄明細表</h3>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">記錄不同訪客、使用之設備與個別實際停留時間</p>
        </div>
        <span id="last-update" style="font-size: 12px; color: var(--text-muted);">正在更新中…</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>造訪時間</th>
              <th>訪客代號</th>
              <th>使用設備</th>
              <th>所在地區</th>
              <th>個別使用時間</th>
              <th>目前狀態</th>
            </tr>
          </thead>
          <tbody id="sessions-tbody">
            <tr><td colspan="6" style="text-align:center; padding: 20px;">資料載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let trendChart = null;
    let platformChart = null;
    let currentToken = sessionStorage.getItem('between_us_admin_session');

    window.addEventListener('DOMContentLoaded', () => {
      if (!currentToken) {
        window.location.replace('/login');
        return;
      }

      // 深色模式記憶檢查
      if (localStorage.getItem('admin_theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('theme-btn').textContent = '淺色模式';
      }

      loadStats();
    });

    function logout() {
      sessionStorage.removeItem('between_us_admin_session');
      window.location.replace('/login');
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('admin_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = isDark ? '淺色模式' : '深色模式';
      if (trendChart) trendChart.destroy();
      if (platformChart) platformChart.destroy();
      trendChart = null;
      platformChart = null;
      loadStats();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getCountryFlag(code) {
      if (!code || code === 'Unknown') return '🌐';
      return code.toUpperCase().replace(/./g, char => 
        String.fromCodePoint(char.charCodeAt(0) + 127397)
      );
    }

    const COUNTRY_NAMES = {
      'TW': '台灣',
      'HK': '香港',
      'JP': '日本',
      'US': '美國',
      'MY': '馬來西亞',
      'SG': '新加坡',
      'CN': '中國大陸',
      'MO': '澳門',
      'AU': '澳洲',
      'CA': '加拿大',
      'GB': '英國'
    };

    const PLATFORM_NAMES = {
      'web': '電腦瀏覽器',
      'iOS (Web)': '蘋果手機瀏覽器',
      'Android (Web)': '安卓手機瀏覽器',
      'iOS (App)': '蘋果手機應用程式',
      'Android (App)': '安卓手機應用程式',
      'macOS': '蘋果電腦系統',
      'Windows': '微軟視窗系統',
      'Linux': 'Linux 系統'
    };

    const PLATFORM_ICONS = {
      'iOS (Web)': '📱',
      'Android (Web)': '📱',
      'iOS (App)': '📱',
      'Android (App)': '📱',
      'macOS': '💻',
      'Windows': '💻',
      'Linux': '💻',
      'web': '🌐'
    };

    function formatDuration(seconds) {
      const sec = Math.max(0, parseInt(seconds, 10) || 0);
      if (sec < 60) return `${sec} 秒`;
      const mins = Math.floor(sec / 60);
      const remainSec = sec % 60;
      if (mins < 60) {
        return remainSec > 0 ? `${mins} 分 ${remainSec} 秒` : `${mins} 分鐘`;
      }
      const hours = Math.floor(mins / 60);
      const remainMin = mins % 60;
      return `${hours} 小時 ${remainMin} 分`;
    }

    async function loadStats() {
      if (!currentToken) return;
      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.textContent = '載入中…';

      try {
        const res = await fetch('/api/admin/stats', {
          headers: { 'Authorization': 'Bearer ' + currentToken }
        });
        if (res.status === 401) {
          logout();
          return;
        }
        const json = await res.json();
        if (json.success && json.data) {
          renderData(json.data);
          document.getElementById('last-update').textContent = '最後更新：' + new Date().toLocaleTimeString();
        }
      } catch (err) {
        console.error('Stats load error:', err);
      } finally {
        refreshBtn.textContent = '重新整理';
      }
    }

    function renderData(data) {
      // 1. 核心指標數值
      document.getElementById('kpi-today-visitors').textContent = (data.overview.todayVisitors || 0).toLocaleString();
      document.getElementById('kpi-total-visitors').textContent = (data.overview.totalVisitors || 0).toLocaleString();
      document.getElementById('kpi-total-sessions').textContent = (data.overview.totalSessions || 0).toLocaleString();
      document.getElementById('kpi-avg-duration').textContent = formatDuration(data.overview.avgDurationSeconds || 0);

      // 2. 地理分佈
      const countryListEl = document.getElementById('country-list');
      if (data.countries && data.countries.length > 0) {
        countryListEl.innerHTML = data.countries.map(c => {
          const rawName = COUNTRY_NAMES[c.country] || c.country;
          const safeName = escapeHtml(rawName);
          const safeUsers = escapeHtml(String(c.users));
          const safeCount = escapeHtml(String(c.count));
          return `
            <li class="data-item">
              <span class="data-item-label">
                <span>${getCountryFlag(c.country)}</span> ${safeName}
              </span>
              <span class="data-item-badge">${safeUsers} 位訪客 · ${safeCount} 次</span>
            </li>
          `;
        }).join('');
      } else {
        countryListEl.innerHTML = '<li class="data-item"><span class="data-item-label">暫無地理數據</span></li>';
      }

      // 3. 趨勢圖表
      const isDark = document.body.classList.contains('dark');
      const textColor = isDark ? '#A39B91' : '#666';
      const gridColor = isDark ? '#2D2824' : '#E8E2D9';

      const trendCanvas = document.getElementById('trendChart');
      if (trendChart) trendChart.destroy();
      trendChart = new Chart(trendCanvas, {
        type: 'line',
        data: {
          labels: data.dailyTrends.map(d => d.date.slice(5)),
          datasets: [
            {
              label: '造訪人數',
              data: data.dailyTrends.map(d => d.users),
              borderColor: '#C25B4E',
              backgroundColor: 'rgba(194, 91, 78, 0.12)',
              fill: true,
              tension: 0.3,
              yAxisID: 'y'
            },
            {
              label: '總使用時間 (分鐘)',
              data: data.dailyTrends.map(d => d.total_minutes || 0),
              borderColor: '#2E7D32',
              backgroundColor: 'rgba(46, 125, 50, 0.08)',
              borderDash: [5, 5],
              tension: 0.3,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: textColor } }
          },
          scales: {
            x: { ticks: { color: textColor }, grid: { color: gridColor } },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              ticks: { color: textColor, precision: 0 },
              grid: { color: gridColor },
              beginAtZero: true
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              ticks: { color: textColor },
              grid: { drawOnChartArea: false },
              beginAtZero: true
            }
          }
        }
      });

      // 4. 設備分佈圖
      const platformCanvas = document.getElementById('platformChart');
      if (platformChart) platformChart.destroy();
      platformChart = new Chart(platformCanvas, {
        type: 'doughnut',
        data: {
          labels: data.platforms.map(p => PLATFORM_NAMES[p.platform] || p.platform),
          datasets: [{
            data: data.platforms.map(p => p.count),
            backgroundColor: ['#C25B4E', '#D9822B', '#0F9960', '#2B95D6', '#8F3985', '#738A9C']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: textColor } }
          }
        }
      });

      // 5. 個別訪客使用記錄明細表格
      const tbody = document.getElementById('sessions-tbody');
      if (data.sessions && data.sessions.length > 0) {
        const nowMs = Date.now();
        tbody.innerHTML = data.sessions.map(s => {
          const time = new Date(s.first_seen + 'Z').toLocaleString('zh-TW', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          });
          const lastActiveMs = new Date(s.last_seen + 'Z').getTime();
          const isActive = (nowMs - lastActiveMs) < (3 * 60 * 1000); // 3 分鐘內活躍

          const rawCountry = COUNTRY_NAMES[s.country] || s.country || '未知地區';
          const safeCountry = escapeHtml(rawCountry);
          const safeCity = (s.city && s.city !== 'Unknown') ? escapeHtml(s.city) : '';
          const loc = safeCity 
            ? `${getCountryFlag(s.country)} ${safeCountry} · ${safeCity}` 
            : `${getCountryFlag(s.country)} ${safeCountry}`;

          const deviceIcon = PLATFORM_ICONS[s.platform] || '📱';
          const safePlatform = escapeHtml(PLATFORM_NAMES[s.platform] || s.platform || '未知設備');
          const rawUserCode = (s.user_id || s.session_id || 'u_guest').slice(-6).toUpperCase();
          const safeUserCode = escapeHtml(rawUserCode);
          const safeDuration = escapeHtml(formatDuration(s.duration_seconds));

          return `
            <tr>
              <td>${escapeHtml(time)}</td>
              <td><span class="user-tag">訪客 #${safeUserCode}</span></td>
              <td><span class="device-badge">${deviceIcon} ${safePlatform}</span></td>
              <td>${loc}</td>
              <td><span class="duration-badge">${safeDuration}</span></td>
              <td>
                <span class="status-badge ${isActive ? 'active' : ''}">
                  <span class="status-dot"></span>
                  ${isActive ? '使用中' : '已結束'}
                </span>
              </td>
            </tr>
          `;
        }).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">尚無訪客使用記錄</td></tr>';
      }
    }

    // 每 30 秒自動靜默刷新
    setInterval(() => {
      if (currentToken && !document.hidden) loadStats();
    }, 30000);
  </script>
</body>
</html>
