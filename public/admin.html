<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流量與數據分析後台 · 在我們之間</title>
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- 未登入自動重定向至專屬登入頁 -->
  <script>
    if (!sessionStorage.getItem('between_us_admin_session')) {
      window.location.replace('/login');
    }
  </script>
  <style>
    :root {
      --bg: #F8F5F0;
      --card-bg: #FFFFFF;
      --border: #E8E2D9;
      --text-main: #2C2825;
      --text-muted: #8E877F;
      --accent: #C25B4E;
      --accent-soft: #F4EBE1;
      --accent-hover: #A8473B;
      --success: #2E7D32;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    body.dark {
      --bg: #141312;
      --card-bg: #1F1D1A;
      --border: #35302A;
      --text-main: #F4EFEA;
      --text-muted: #9E958C;
      --accent: #E07A6D;
      --accent-soft: #382C28;
      --accent-hover: #F29387;
      --success: #4CAF50;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      transition: background-color 0.2s, color 0.2s;
    }

    /* 頂部導覽列 */
    .navbar {
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon-box {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .brand-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .nav-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .nav-badge {
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-pill {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-logout {
      color: #E53935;
      border-color: #FFCDD2;
    }
    .btn-logout:hover {
      background: #FFEBEE;
      border-color: #E53935;
      color: #D32F2F;
    }
    body.dark .btn-logout {
      border-color: #5C2320;
      color: #EF9A9A;
    }
    body.dark .btn-logout:hover {
      background: #3B1B19;
      color: #FFCDD2;
    }

    /* 主要容器 */
    .main-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px;
    }

    /* 關鍵數據指標卡片 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .kpi-title {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text-main);
    }
    .kpi-sub {
      font-size: 12px;
      color: var(--accent);
      margin-top: 4px;
      font-weight: 500;
    }

    /* 圖表網格 */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }
    .chart-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
    }

    /* 嚴格鎖定圖表容器高度，防止無限延展 */
    .chart-canvas-wrapper {
      position: relative;
      width: 100%;
      height: 260px;
      max-height: 260px;
      flex-shrink: 0;
    }

    /* 排行清單 */
    .data-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }
    .data-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg);
      font-size: 13px;
    }
    .data-item-label {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .data-item-badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 數據表格 */
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th {
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    tr:last-child td {
      border-bottom: none;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-flip { background: #E8F5E9; color: #2E7D32; }
    .tag-page { background: #E3F2FD; color: #1565C0; }
    .tag-fav { background: #FFF3E0; color: #E65100; }
    .tag-cat { background: #F3E5F5; color: #7B1FA2; }
    body.dark .tag-flip { background: #1B3820; color: #81C784; }
    body.dark .tag-page { background: #152A3E; color: #64B5F6; }
    body.dark .tag-fav { background: #3E2914; color: #FFB74D; }
    body.dark .tag-cat { background: #35193B; color: #BA68C8; }
  </style>
</head>
<body>
  <!-- 頂部導覽列 -->
  <header class="navbar">
    <div class="nav-left">
      <div class="brand-icon-box">
        <img src="/icon.png" class="brand-icon-img" alt="在我們之間" onerror="this.src='/favicon.ico'">
      </div>
      <span class="nav-title">在我們之間 · 數據分析後台</span>
      <span class="nav-badge">即時監控中</span>
    </div>
    <div class="nav-actions">
      <span class="user-pill">管理者：系統管理員</span>
      <button class="btn-action" onclick="toggleTheme()" id="theme-btn">深色模式</button>
      <button class="btn-action" onclick="loadStats()" id="refresh-btn">重新整理</button>
      <button class="btn-action btn-logout" onclick="logout()">安全登出</button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="main-container">
    <!-- 核心數據統計 -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">今日造訪人數</div>
        <div class="kpi-value" id="kpi-today-sessions">0</div>
        <div class="kpi-sub">獨立活躍工作階段</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">今日翻牌互動</div>
        <div class="kpi-value" id="kpi-today-flips">0</div>
        <div class="kpi-sub">深度對話探索次數</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">累積獨立訪客</div>
        <div class="kpi-value" id="kpi-total-sessions">0</div>
        <div class="kpi-sub">歷史累積使用者</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">全站累積互動</div>
        <div class="kpi-value" id="kpi-total-events">0</div>
        <div class="kpi-sub">各平台互動總累積</div>
      </div>
    </section>

    <!-- 圖表區 -->
    <div class="charts-grid">
      <!-- 趨勢圖 -->
      <div class="chart-panel">
        <div class="panel-header">
          <h3 class="panel-title">近 14 日造訪人數與翻牌趨勢折線圖</h3>
        </div>
        <div class="chart-canvas-wrapper">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- 分類排行 -->
      <div class="chart-panel">
        <div class="panel-header">
          <h3 class="panel-title">熱門話題主題排行榜</h3>
        </div>
        <ul class="data-list" id="category-list">
          <li class="data-item"><span class="data-item-label">資料載入中…</span></li>
        </ul>
      </div>
    </div>

    <!-- 地理與設備區 -->
    <div class="charts-grid">
      <!-- 地理位置 -->
      <div class="chart-panel">
        <div class="panel-header">
          <h3 class="panel-title">使用者地理分佈前 10 大地區</h3>
        </div>
        <ul class="data-list" id="country-list">
          <li class="data-item"><span class="data-item-label">資料載入中…</span></li>
        </ul>
      </div>

      <!-- 設備比例 -->
      <div class="chart-panel">
        <div class="panel-header">
          <h3 class="panel-title">使用設備與作業系統佔比</h3>
        </div>
        <div class="chart-canvas-wrapper">
          <canvas id="platformChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 即時動態表格 -->
    <section class="chart-panel">
      <div class="panel-header">
        <h3 class="panel-title">最新使用者即時互動動態</h3>
        <span id="last-update" style="font-size: 12px; color: var(--text-muted);">正在更新中…</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>發生時間</th>
              <th>互動類型</th>
              <th>對應主題</th>
              <th>使用語言</th>
              <th>地理位置</th>
              <th>使用設備與系統</th>
            </tr>
          </thead>
          <tbody id="events-tbody">
            <tr><td colspan="6" style="text-align:center; padding: 20px;">資料載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let trendChart = null;
    let platformChart = null;
    let currentToken = sessionStorage.getItem('between_us_admin_session');

    window.addEventListener('DOMContentLoaded', () => {
      if (!currentToken) {
        window.location.replace('/login');
        return;
      }

      // 深色模式記憶檢查
      if (localStorage.getItem('admin_theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('theme-btn').textContent = '淺色模式';
      }

      loadStats();
    });

    function logout() {
      sessionStorage.removeItem('between_us_admin_session');
      window.location.replace('/login');
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('admin_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = isDark ? '淺色模式' : '深色模式';
      if (trendChart) trendChart.destroy();
      if (platformChart) platformChart.destroy();
      trendChart = null;
      platformChart = null;
      loadStats();
    }

    function getCountryFlag(code) {
      if (!code || code === 'Unknown') return '🌐';
      return code.toUpperCase().replace(/./g, char => 
        String.fromCodePoint(char.charCodeAt(0) + 127397)
      );
    }

    const COUNTRY_NAMES = {
      'TW': '台灣',
      'HK': '香港',
      'JP': '日本',
      'US': '美國',
      'MY': '馬來西亞',
      'SG': '新加坡',
      'CN': '中國大陸',
      'MO': '澳門',
      'AU': '澳洲',
      'CA': '加拿大',
      'GB': '英國'
    };

    const CAT_NAMES = {
      'vision': '價值與未來',
      'soul': '靈魂與內心',
      'finance': '金錢與生活',
      'intimacy': '親密與浪漫',
      'fun': '趣味與童心',
      'growth': '個人成長',
      'faith': '信念與世界觀'
    };

    const LANG_NAMES = {
      'zh-TW': '繁體中文',
      'zh-CN': '簡體中文',
      'en': '英文'
    };

    const PLATFORM_NAMES = {
      'web': '電腦瀏覽器',
      'iOS (Web)': '蘋果手機瀏覽器',
      'Android (Web)': '安卓手機瀏覽器',
      'iOS (App)': '蘋果手機應用程式',
      'Android (App)': '安卓手機應用程式',
      'macOS': '蘋果電腦系統',
      'Windows': '微軟視窗系統',
      'Linux': 'Linux 系統'
    };

    async function loadStats() {
      if (!currentToken) return;
      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.textContent = '載入中…';

      try {
        const res = await fetch('/api/admin/stats', {
          headers: { 'Authorization': 'Bearer ' + currentToken }
        });
        if (res.status === 401) {
          logout();
          return;
        }
        const json = await res.json();
        if (json.success && json.data) {
          renderData(json.data);
          document.getElementById('last-update').textContent = '最後更新：' + new Date().toLocaleTimeString();
        }
      } catch (err) {
        console.error('Stats load error:', err);
      } finally {
        refreshBtn.textContent = '重新整理';
      }
    }

    function renderData(data) {
      // 1. 核心指標數值
      document.getElementById('kpi-today-sessions').textContent = data.overview.todaySessions.toLocaleString();
      document.getElementById('kpi-today-flips').textContent = data.overview.todayFlips.toLocaleString();
      document.getElementById('kpi-total-sessions').textContent = data.overview.totalSessions.toLocaleString();
      document.getElementById('kpi-total-events').textContent = data.overview.totalEvents.toLocaleString();

      // 2. 主題分類排行
      const catListEl = document.getElementById('category-list');
      if (data.categories && data.categories.length > 0) {
        catListEl.innerHTML = data.categories.map(c => `
          <li class="data-item">
            <span class="data-item-label">
              <span>✦</span> ${CAT_NAMES[c.category] || c.category}
            </span>
            <span class="data-item-badge">${c.count} 次</span>
          </li>
        `).join('');
      } else {
        catListEl.innerHTML = '<li class="data-item"><span class="data-item-label">暫無分類數據</span></li>';
      }

      // 3. 地理分佈
      const countryListEl = document.getElementById('country-list');
      if (data.countries && data.countries.length > 0) {
        countryListEl.innerHTML = data.countries.map(c => `
          <li class="data-item">
            <span class="data-item-label">
              <span>${getCountryFlag(c.country)}</span> ${COUNTRY_NAMES[c.country] || c.country}
            </span>
            <span class="data-item-badge">${c.users} 訪客 · ${c.count} 次</span>
          </li>
        `).join('');
      } else {
        countryListEl.innerHTML = '<li class="data-item"><span class="data-item-label">暫無地理數據</span></li>';
      }

      // 4. 趨勢圖表
      const isDark = document.body.classList.contains('dark');
      const textColor = isDark ? '#A39B91' : '#666';
      const gridColor = isDark ? '#2D2824' : '#E8E2D9';

      const trendCanvas = document.getElementById('trendChart');
      if (trendChart) trendChart.destroy();
      trendChart = new Chart(trendCanvas, {
        type: 'line',
        data: {
          labels: data.dailyTrends.map(d => d.date.slice(5)),
          datasets: [
            {
              label: '翻牌次數',
              data: data.dailyTrends.map(d => d.card_flips),
              borderColor: '#C25B4E',
              backgroundColor: 'rgba(194, 91, 78, 0.12)',
              fill: true,
              tension: 0.3
            },
            {
              label: '造訪人數',
              data: data.dailyTrends.map(d => d.users),
              borderColor: '#8E877F',
              borderDash: [5, 5],
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: textColor } }
          },
          scales: {
            x: { ticks: { color: textColor }, grid: { color: gridColor } },
            y: { ticks: { color: textColor, precision: 0 }, grid: { color: gridColor }, beginAtZero: true }
          }
        }
      });

      // 5. 設備分佈圖
      const platformCanvas = document.getElementById('platformChart');
      if (platformChart) platformChart.destroy();
      platformChart = new Chart(platformCanvas, {
        type: 'doughnut',
        data: {
          labels: data.platforms.map(p => PLATFORM_NAMES[p.platform] || p.platform),
          datasets: [{
            data: data.platforms.map(p => p.count),
            backgroundColor: ['#C25B4E', '#D9822B', '#0F9960', '#2B95D6', '#8F3985', '#738A9C']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: textColor } }
          }
        }
      });

      // 6. 即時動態表格
      const tbody = document.getElementById('events-tbody');
      if (data.recentEvents && data.recentEvents.length > 0) {
        tbody.innerHTML = data.recentEvents.map(e => {
          let tagClass = 'tag-page';
          let tagLabel = e.event_name;
          if (e.event_name === 'flip_card') { tagClass = 'tag-flip'; tagLabel = '翻開卡牌'; }
          else if (e.event_name === 'next_question') { tagClass = 'tag-page'; tagLabel = '換下一題'; }
          else if (e.event_name === 'toggle_favorite') { tagClass = 'tag-fav'; tagLabel = '卡牌收藏'; }
          else if (e.event_name === 'change_category') { tagClass = 'tag-cat'; tagLabel = '切換主題'; }
          else if (e.event_name === 'start_timer') { tagClass = 'tag-cat'; tagLabel = '開始計時'; }
          else if (e.event_name === 'change_language') { tagClass = 'tag-page'; tagLabel = '切換語言'; }
          else if (e.event_name === 'pageview') { tagClass = 'tag-page'; tagLabel = '訪問首頁'; }

          const time = new Date(e.created_at + 'Z').toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const countryName = COUNTRY_NAMES[e.country] || e.country;
          const loc = (e.city && e.city !== 'Unknown') ? `${getCountryFlag(e.country)} ${countryName} · ${e.city}` : `${getCountryFlag(e.country)} ${countryName}`;

          return `
            <tr>
              <td>${time}</td>
              <td><span class="tag ${tagClass}">${tagLabel}</span></td>
              <td>${CAT_NAMES[e.category] || e.category || '全部'}</td>
              <td>${LANG_NAMES[e.language] || e.language || '-'}</td>
              <td>${loc}</td>
              <td>${PLATFORM_NAMES[e.platform] || e.platform || '-'}</td>
            </tr>
          `;
        }).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">尚無即時數據</td></tr>';
      }
    }

    // 每 30 秒自動靜默刷新
    setInterval(() => {
      if (currentToken && !document.hidden) loadStats();
    }, 30000);
  </script>
</body>
</html>
